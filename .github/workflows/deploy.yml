name: Deploy to Replicate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to r8.im registry
        uses: docker/login-action@v3
        with:
          registry: r8.im
          username: hevn00
          password: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: Install Cog
        run: |
          sudo curl -o /usr/local/bin/cog -L "https://github.com/replicate/cog/releases/latest/download/cog_Linux_x86_64"
          sudo chmod +x /usr/local/bin/cog
          cog --version

      - name: Push to Replicate
        run: cog push r8.im/hevn00/lopeka-lights
