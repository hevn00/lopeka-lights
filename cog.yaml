build:
  python_version: "3.11"
  cuda: "12.1"
  python_packages:
    - torch==2.2.0
    - torchvision
    - diffusers==0.27.2
    - transformers
    - accelerate
    - safetensors
    - Pillow
    - numpy
    - huggingface_hub
    - scipy
    - einops
  system_packages:
    - libgl1-mesa-glx
    - libglib2.0-0
  run:
    - mkdir -p /src/models && wget -q "https://huggingface.co/lllyasviel/ic-light/resolve/main/iclight_sd15_fbc.safetensors" -O /src/models/iclight_sd15_fbc.safetensors

predict: "predict.py:Predictor"
